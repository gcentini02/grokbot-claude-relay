[package]
name = "grokbot-claude-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A tiny, local-only message relay and MCP server that lets Claude and the Grok Bot app talk safely on one computer"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "claude", "grok", "relay", "sqlite"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hex = "0.4.3"
rusqlite = { version = "0.41.0", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
